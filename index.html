<title>Serviços de Condutores – CPR-1</title>
<style>
:root{--bg:#f3f3f3;--nav:#eeeeee;--card:#fff;--card2:#f6f8fb;--field:#fbfbfb;--line:#e3e3e3;--tx:#1b1b1b;--tx2:#5c5c5c;--ac:#0067c0;--acd:#004e92;--actx:#fff;--edge:#c9d3df;--ok:#0f7b0f;--warn:#9d5d00;--bad:#c42b1c;--sh:rgba(0,0,0,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202020;--nav:#272727;--card:#2c2c2c;--card2:#333;--field:#363636;--line:#404040;--tx:#fff;--tx2:#c5c5c5;--ac:#60cdff;--acd:#2b8fc0;--actx:#00293f;--edge:#1a1a1a;--ok:#6ccb5f;--warn:#fce100;--bad:#ff99a4;--sh:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202020;--nav:#272727;--card:#2c2c2c;--card2:#333;--field:#363636;--line:#404040;--tx:#fff;--tx2:#c5c5c5;--ac:#60cdff;--acd:#2b8fc0;--actx:#00293f;--edge:#1a1a1a;--ok:#6ccb5f;--warn:#fce100;--bad:#ff99a4;--sh:rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:248px 1fr;background:radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--ac) 10%,transparent),transparent),var(--bg)}
nav{background:var(--nav);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 16px;font-weight:600}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--ac);color:var(--actx);display:grid;place-items:center}
.brand small{display:block;font-weight:400;color:var(--tx2);font-size:12px}
nav button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:6px;position:relative}
nav button:hover{background:color-mix(in srgb,var(--tx) 6%,transparent)}
nav button.on{background:color-mix(in srgb,var(--tx) 9%,transparent)}
nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac)}
nav button:focus-visible,.btn:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{overflow-y:auto;padding:24px 32px 40px}
h1{font:600 28px/1.2 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--tx2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 2px 4px rgba(0,0,0,.04)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:12px;color:var(--tx2)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--line);border-bottom-color:color-mix(in srgb,var(--tx) 45%,var(--line));border-radius:4px;padding:7px 10px;min-height:34px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-bottom:2px solid var(--ac);padding-bottom:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.btn{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:6px 14px;min-height:32px;border-radius:4px;background:var(--card);border:1px solid var(--line);border-bottom-color:color-mix(in srgb,var(--tx) 25%,var(--line))}
.btn:hover{background:var(--card2)}.btn.pri{background:var(--ac);color:var(--actx);border-color:var(--ac)}.btn.pri:hover{background:var(--acd);color:#fff}.btn.del{color:var(--bad)}
.sp{flex:1}
.chip{padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px}
.list{margin-top:6px}
.row,.hd{display:grid;grid-template-columns:118px 1.1fr 110px 1.6fr 110px 96px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.hd{color:var(--tx2);font-size:12px;position:sticky;top:0;background:var(--card);z-index:1}
.row{cursor:pointer}.row:hover{background:var(--card2)}
.row small{display:block;color:var(--tx2)}
.st{font-weight:600;font-size:12px}.st.c{color:var(--ok)}.st.p{color:var(--warn)}.st.x{color:var(--bad)}
.empty{padding:36px;text-align:center;color:var(--tx2)}
.rep{max-width:900px}
.rep h2{font-weight:600;font-size:15px;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ac);text-transform:capitalize}
.it b small{font-weight:400}.it{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.it small{color:var(--tx2);display:block}
.stage{perspective:1400px;display:grid;justify-items:center;padding:12px 0 20px}
.f3d{width:min(760px,100%);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:26px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),5px 6px 0 -1px var(--edge),10px 14px 0 -3px color-mix(in srgb,var(--edge) 70%,#000),18px 28px 38px var(--sh)}
.f3d::before{content:"";position:absolute;inset:8px -8px -8px 8px;border-radius:18px;background:var(--edge);transform:translateZ(-26px);z-index:-1}
.f3d h1,.f3d .sub{transform:translateZ(36px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}.grid .w{grid-column:1/-1}
.fl{transform:translateZ(22px)}
.fl input,.fl select,.fl textarea{box-shadow:0 6px 10px -6px var(--sh)}
.acts{display:flex;gap:10px;margin-top:18px;transform:translateZ(34px)}
.acts .btn{box-shadow:0 4px 0 var(--edge),0 10px 14px -4px var(--sh);transition:transform .1s,box-shadow .1s}
.acts .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.acts .pri{box-shadow:0 4px 0 var(--acd),0 10px 14px -4px var(--sh)}
@media (hover:none){.f3d{animation:fl 9s ease-in-out infinite}}
@keyframes fl{50%{transform:rotateX(4deg) rotateY(-5deg)}}
@media (prefers-reduced-motion:reduce){.f3d{animation:none!important;transform:none;transition:none}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px var(--sh);z-index:9}
@media (max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:1fr auto}
nav{grid-row:2;flex-direction:row;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.brand{display:none}
nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px}nav button.on::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px}
main{padding:16px 14px 20px}h1{font-size:22px}
.hd{display:none}.row{display:flex;flex-wrap:wrap;gap:2px 12px}.row .c-d,.row .dest{flex-basis:100%}
.grid{grid-template-columns:1fr}.it{grid-template-columns:50px 1fr}.it .st{grid-column:2}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media print{nav,.bar,.noprint{display:none!important}.app{display:block;height:auto}main{overflow:visible;padding:0}body{background:#fff;color:#000}.card{border:0;box-shadow:none}}
.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}.top img{height:76px;width:auto}.top b{display:block;font-size:16px;line-height:1.3}.top span{display:block;color:var(--tx2);font-size:13px;line-height:1.35}.top span+span{font-weight:600;color:var(--tx)}@media (max-width:760px){.top img{height:56px}.top b{font-size:14px}.top span{font-size:12px}}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}.ch>b{display:block;margin-bottom:10px}.bl{display:grid;grid-template-columns:minmax(90px,150px) 1fr 36px;gap:10px;align-items:center;padding:4px 0}.bt{height:16px;background:var(--card2);border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;background:var(--ac);border-radius:4px}.bl b{text-align:right}
.dev{margin:28px auto 0;max-width:760px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--tx2);display:grid;gap:2px}.dev b{color:var(--tx);font-size:13px}
.app.lg{grid-template-columns:1fr;grid-template-rows:1fr}.app.lg nav{display:none}.lgc{max-width:420px;margin:5vh auto 0}.lgc .top{justify-content:center}.ur{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}.ur>div{flex:1;min-width:150px}.ur small{display:block;color:var(--tx2)}@media (max-width:760px){nav button{padding:6px 8px}}
</style>

function bindU(){const E=t=>{$("#ue").textContent=t};
 $("#uf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),u=f.user.trim().toLowerCase();
  if(US.some(x=>x.user==u))return E("Este usuário já existe.");const salt=rs();const nu={user:u,name:f.name.trim(),salt,hash:await hs(f.pw,salt),admin:f.admin=="1"};await persist(()=>{US=US.filter(x=>x.user!=u);US.push(nu)});toast("Usuário adicionado");go()};
 document.querySelectorAll(".rp").forEach(b=>b.onclick=async()=>{const i=document.querySelector(`.np[data-u="${CSS.escape(b.dataset.u)}"]`);if(i.value.length<6)return E("A nova senha precisa de ao menos 6 caracteres.");const un=b.dataset.u,sa=rs(),hh=await hs(i.value,sa);await persist(()=>{const u=US.find(x=>x.user==un);if(u){u.salt=sa;u.hash=hh}});i.value="";E("");toast("Senha redefinida")});
 document.querySelectorAll(".xd").forEach(b=>b.onclick=async()=>{if(b.dataset.c!="1"){b.dataset.c="1";b.lastChild.textContent="Confirmar";return}const u=US.find(x=>x.user==b.dataset.u);if(u.admin&&US.filter(x=>x.admin).length<2)return E("Não é possível excluir o único administrador.");await persist(()=>{US=US.filter(x=>x.user!=u.user)});go()})}

/* ---- GitHub ---- */
const GK="cpr1_gh";let G=null;try{G=JSON.parse(localStorage.getItem(GK))}catch(e){}
const gsave=()=>{try{G&&localStorage.setItem(GK,JSON.stringify(G))}catch(e){}},saveL=()=>{save();saveU()};
const b64=t=>{let b="";new TextEncoder().encode(t).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const gurl=()=>`https://api.github.com/repos/${G.o}/${G.r}/contents/${G.p.split("/").map(encodeURIComponent).join("/")}`;
const ghx=(m,u,b)=>fetch(u,{method:m,cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+G.t,"X-GitHub-Api-Version":"2022-11-28",...(b?{"Content-Type":"application/json"}:{})},body:b?JSON.stringify(b):undefined});
async function diag(){const r=await ghx("GET",`https://api.github.com/repos/${G.o}/${G.r}`);
 if(r.status==401)throw new Error("o token é inválido ou expirou. Gere um novo token.");
 if(r.status==404)throw new Error("repositório “"+G.o+"/"+G.r+"” não encontrado. Confira o nome do dono e do repositório e se o token foi liberado para ele (Repository access).");
 if(!r.ok)throw new Error("erro "+r.status+" ao acessar o repositório.");
 const j=await r.json();
 if(!j.private)throw new Error("o repositório é PÚBLICO. Por segurança, use um repositório privado para os dados.");
 if(j.permissions&&!j.permissions.push)throw new Error("o token só tem leitura. Nas permissões do token, deixe Contents como Read and write.")}
async function pull(){const r=await ghx("GET",gurl()+"?ref="+encodeURIComponent(G.b));
 if(r.status==404){G.sha=null;return}
 if(!r.ok)throw new Error(r.status==401?"token inválido":r.status==403?"sem permissão":"erro "+r.status);
 const j=await r.json(),d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,"")),c=>c.charCodeAt(0))));
 G.sha=j.sha;D=d.servicos||[];US=d.usuarios||[];saveL();gsave()}
async function push(){const r=await ghx("PUT",gurl(),{message:"Atualização pelo aplicativo ("+(ME?ME.user:"sistema")+")",content:b64(JSON.stringify({v:1,servicos:D,usuarios:US})),branch:G.b,...(G.sha?{sha:G.sha}:{})});
 if(r.status==409||r.status==422)return"conflito";if(!r.ok)throw new Error(r.status==401?"token inválido":r.status==403||r.status==404?"sem permissão de escrita ou branch “"+G.b+"” inexistente":"erro "+r.status);
 G.sha=(await r.json()).content.sha;G.pend=false;gsave();return"ok"}
async function persist(fn){if(!G){fn();saveL();return true}
 try{if(!G.pend)await pull()}catch(e){toast("Sem conexão com o GitHub: "+e.message)}
 fn();saveL();
 try{let s=await push();if(s=="conflito"){await pull();fn();saveL();s=await push();if(s!="ok")throw new Error("conflito, tente de novo")}toast("Gravado no GitHub");return true}
 catch(e){G.pend=true;gsave();toast("Salvo no aparelho, mas não enviado: "+e.message);return false}}
async function syncNow(){if(!G)return;try{if(G.pend){const s=await push();if(s=="conflito"){await pull();toast("Conflito: dados do GitHub carregados")}else toast("Enviado ao GitHub")}else{await pull();toast("Sincronizado")}}catch(e){toast("Falha: "+e.message)}}
const ghUI=()=>{const g=G||{};return `<div class="card" style="margin-top:12px"><p class="sub" style="margin-bottom:10px">Grava e lê os serviços e usuários em um arquivo JSON de um repositório do GitHub, para todos os aparelhos usarem a mesma base. Use um repositório <b>privado</b> e um token com permissão <b>Contents: Read and write</b> só nele. Se o arquivo já existir, os dados dele substituem os deste aparelho.</p><div class="filters"><label>Usuário ou organização<input id="go" value="${esc(g.o||"")}" autocapitalize="none"></label><label>Repositório<input id="gr" value="${esc(g.r||"")}" autocapitalize="none"></label><label>Branch<input id="gb" value="${esc(g.b||"main")}"></label><label>Arquivo<input id="gp" value="${esc(g.p||"condutores.json")}"></label><label>Token de acesso<input id="gt" type="password" value="${esc(g.t||"")}"></label></div><div class="bar"><button class="btn pri" id="gs" type="button">Salvar e sincronizar</button>${G?`<button class="btn" id="gy" type="button">Sincronizar agora</button><button class="btn del" id="gx" type="button">Desconectar</button>`:""}</div><p id="gm" class="st"></p></div>`};
function bindH(){const s=$("#gs");if(!s)return;const M=(t,c)=>{const e=$("#gm");e.textContent=t;e.className="st "+(c||"")};
 s.onclick=async()=>{const g={o:$("#go").value.trim(),r:$("#gr").value.trim(),b:$("#gb").value.trim()||"main",p:$("#gp").value.trim()||"condutores.json",t:$("#gt").value.trim()};if(!g.o||!g.r||!g.t)return M("Preencha usuário, repositório e token.","x");
  const old=G;G=g;M("Conectando…");try{await diag();await pull();if(G.sha===null&&ME)await push();gsave();toast("GitHub conectado");ME?go():loginUI()}catch(e){G=old;M("Falha: "+e.message,"x")}};
 const y=$("#gy");if(y)y.onclick=async()=>{await syncNow();go()};
 const x=$("#gx");if(x)x.onclick=()=>{G=null;try{localStorage.removeItem(GK)}catch(e){}ME?go():loginUI()}}
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&G&&ME&&!G.pend&&view!="n"){try{await pull();go()}catch(e){}}});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{if(G){try{await pull()}catch(e){toast("Sem sincronização: "+e.message)}}let s;try{s=sessionStorage.getItem("cpr1_sess")}catch(e){}ME=US.find(u=>u.user==s)||null;ME?go():loginUI()})();
</script>
</body>
